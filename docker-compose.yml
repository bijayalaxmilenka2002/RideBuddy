# One command to run the whole app locally:
#
#   docker compose up
#
# That starts MongoDB, the API and the web client together - no MongoDB
# install, no Atlas account, no .env to fill in. Then open
# http://localhost:5173
#
# Secrets are not hard-coded: JWT_SECRET falls back to a throwaway value for
# local development, and you can override it by putting JWT_SECRET=... in a
# .env file next to this one (Docker Compose reads it automatically).
# Deployments supply their own; see docs/DEPLOYMENT.md.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # The API waits for this, so it never starts against a database that is
      # not accepting connections yet.
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ridebuddy
      JWT_SECRET: ${JWT_SECRET:-local-development-only-not-a-real-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - '5000:5000'

  web:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:5000
      # Needed for hot reload to work across a bind mount on Windows/macOS.
      VITE_USE_POLLING: 'true'
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    # --host exposes Vite outside the container.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - '5173:5173'

volumes:
  mongo-data:
  web-node-modules:
